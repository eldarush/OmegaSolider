name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.203'
    - name: Restore dependencies
      run: dotnet restore
    - name: Build and Pack
      run: dotnet build -c Release
    - name: Verify published wire contract
      run: dotnet test tests/OmegaSolider.ContractTests/OmegaSolider.ContractTests.csproj -c Release --logger trx
    - name: Upload NuGet Package
      uses: actions/upload-artifact@v4
      with:
        name: OmegaSolider-Package
        path: bin/Release/*.nupkg
